# Create GitHub release on tag push. Backend + e2e tests run first; release only created if tests pass.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run backend unit tests
        working-directory: backend
        run: mvn test -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Build frontend for e2e
        working-directory: frontend
        env:
          VITE_API_URL: 'http://localhost:8080'
          VITE_API_KEY: ${{ secrets.HORAIN_API_KEY || 'HORAIN_DEV_KEY' }}
        run: npm run build

      - name: Run e2e tests
        working-directory: frontend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORAIN_API_KEY: ${{ secrets.HORAIN_API_KEY || 'HORAIN_DEV_KEY' }}
          PROMPTFOO_DISABLE_WAL_MODE: 'true'
        run: |
          cd ..
          cd backend
          mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dserver.address=0.0.0.0" &
          BACKEND_PID=$!
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null | grep -q 200; then
              echo "Backend ready."
              break
            fi
            sleep 2
          done
          curl -s http://localhost:8080/health || true

          echo "Seeding backend for e2e..."
          curl -s -X POST http://localhost:8080/dev/seed \
            -H "Authorization: Bearer ${HORAIN_API_KEY:-HORAIN_DEV_KEY}" \
            -H "Content-Type: application/json" -d '{"fixedToday":"2025-03-10"}' || true

          cd ../frontend
          echo "Starting frontend server for e2e..."
          npx serve -s dist -l 4173 &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4173 2>/dev/null | grep -q 200; then
              echo "Frontend server ready."
              break
            fi
            sleep 1
          done
          curl -s -o /dev/null -w "%{http_code}" http://localhost:4173 || true

          echo "Running e2e tests..."
          npm run test:e2e

          kill $SERVE_PID 2>/dev/null || true

  create-release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag
        id: get_tag
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          PREV=$(git tag -l --sort=-v:refname | sed -n 2p)
          if [ -n "$PREV" ]; then
            CHANGELOG=$(git log "$PREV..$TAG" --pretty=format:"- %s (%h)")
          else
            CHANGELOG=$(git log "$TAG" --pretty=format:"- %s (%h)" -30)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- No commits since last tag"
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get_tag.outputs.tag }}"
          echo "## Changes" > notes.md
          echo "" >> notes.md
          echo "${{ steps.changelog.outputs.changelog }}" >> notes.md
          gh release create "$TAG" --notes-file notes.md
