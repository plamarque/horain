# Deploy Horain to production on push to main.
# Backend and frontend deploy only after tests pass (unified pipeline).
# - Backend → Cloud Run (via gcloud builds submit from this workflow; see docs/CLOUD_RUN_SETUP.md)
# - Frontend → GitHub Pages only after Cloud Run deploy succeeds for this commit
# - If the backend deployed but the frontend build or Pages deploy fails, traffic is rolled back to the
#   revision that was serving before this workflow run (see rollback-cloud-run-on-frontend-failure job)
#
# CI: mvn test always. E2e is skipped when the push only changes package.json / frontend/package.json /
# backend/pom.xml (e.g. "prepare next dev" after a release). See docs/DEVELOPMENT.md.
# E2E requires OPENAI_API_KEY secret when e2e runs.
# GCP: Workload Identity Federation (secrets GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, etc.).
name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  detect-version-only:
    name: Detect version-only push
    runs-on: ubuntu-latest
    outputs:
      skip_e2e: ${{ steps.pick.outputs.skip_e2e }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute skip_e2e
        id: pick
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Full CI: invalid or initial before SHA"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || true)
          if [ -z "$CHANGED" ]; then
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Full CI: empty diff"
            exit 0
          fi
          BAD=$(echo "$CHANGED" | grep -vxE 'package.json|frontend/package.json|backend/pom.xml' || true)
          if [ -n "$BAD" ]; then
            echo "skip_e2e=false" >> "$GITHUB_OUTPUT"
            echo "Full CI: non-version files in push"
          else
            echo "skip_e2e=true" >> "$GITHUB_OUTPUT"
            echo "Skipping e2e: only version manifests changed"
          fi

  test:
    name: Test
    needs: detect-version-only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run backend unit tests
        working-directory: backend
        run: mvn test -q

      - name: Set up Node.js
        if: needs.detect-version-only.outputs.skip_e2e != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: needs.detect-version-only.outputs.skip_e2e != 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        if: needs.detect-version-only.outputs.skip_e2e != 'true'
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Build frontend for e2e
        if: needs.detect-version-only.outputs.skip_e2e != 'true'
        working-directory: frontend
        env:
          VITE_API_URL: 'http://localhost:8080'
          VITE_API_KEY: ${{ secrets.HORAIN_API_KEY || 'HORAIN_DEV_KEY' }}
        run: npm run build

      - name: Run e2e tests
        if: needs.detect-version-only.outputs.skip_e2e != 'true'
        working-directory: frontend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORAIN_API_KEY: ${{ secrets.HORAIN_API_KEY || 'HORAIN_DEV_KEY' }}
          PROMPTFOO_DISABLE_WAL_MODE: 'true'
        run: |
          cd ..
          cd backend
          mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dserver.address=0.0.0.0" &
          BACKEND_PID=$!
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null | grep -q 200; then
              echo "Backend ready."
              break
            fi
            sleep 2
          done
          curl -s http://localhost:8080/health || true

          echo "Seeding backend for e2e..."
          curl -s -X POST http://localhost:8080/dev/seed \
            -H "Authorization: Bearer ${HORAIN_API_KEY:-HORAIN_DEV_KEY}" \
            -H "Content-Type: application/json" -d '{"fixedToday":"2025-03-10"}' || true

          cd ../frontend
          echo "Starting frontend server for e2e..."
          npx serve -s dist -l 4173 &
          SERVE_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4173 2>/dev/null | grep -q 200; then
              echo "Frontend server ready."
              break
            fi
            sleep 1
          done
          curl -s -o /dev/null -w "%{http_code}" http://localhost:4173 || true

          echo "Running e2e tests..."
          npm run test:e2e

          kill $SERVE_PID 2>/dev/null || true

      - name: Skip e2e (version-only commit)
        if: needs.detect-version-only.outputs.skip_e2e == 'true'
        run: |
          echo "E2e skipped (version-only push). Backend unit tests passed."

  deploy-backend:
    name: Deploy backend to Cloud Run
    needs: test
    runs-on: ubuntu-latest
    outputs:
      previous_revision: ${{ steps.capture_revision.outputs.previous_revision }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Capture current revision before deploy
        id: capture_revision
        run: |
          REV=$(gcloud run services describe "${{ secrets.GCP_SERVICE_NAME }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)
          echo "previous_revision=${REV}" >> "$GITHUB_OUTPUT"
          if [ -z "$REV" ]; then
            echo "No revision captured (first deploy or service missing). Rollback will be skipped if the frontend fails."
          else
            echo "Captured revision to restore on frontend failure: ${REV}"
          fi

      - name: Submit build and deploy to Cloud Run
        run: |
          gcloud builds submit \
            --config=cloudbuild.yaml \
            --substitutions=COMMIT_SHA=${{ github.sha }},_REGION=${{ secrets.GCP_REGION }},_SERVICE_NAME=${{ secrets.GCP_SERVICE_NAME }},_REPOSITORY=${{ secrets.GCP_ARTIFACT_REPOSITORY }} \
            .

  build-and-deploy-frontend:
    name: Build and deploy frontend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_STT_LANG: ${{ secrets.VITE_STT_LANG }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-frontend:
    name: Deploy to GitHub Pages
    needs: [build-and-deploy-frontend, deploy-backend]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  rollback-cloud-run-on-frontend-failure:
    name: Rollback Cloud Run on frontend failure
    needs: [deploy-backend, build-and-deploy-frontend, deploy-frontend]
    if: always() && needs.deploy-backend.result == 'success' && (needs.build-and-deploy-frontend.result == 'failure' || needs.deploy-frontend.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Point traffic at previous revision
        run: |
          PREV="${{ needs.deploy-backend.outputs.previous_revision }}"
          if [ -z "$PREV" ]; then
            echo "No previous revision to roll back to (first deployment or capture failed). Skipping."
            exit 0
          fi
          echo "Rolling back traffic to revision: $PREV"
          gcloud run services update-traffic "${{ secrets.GCP_SERVICE_NAME }}" \
            --region="${{ secrets.GCP_REGION }}" \
            --to-revisions="${PREV}=100"
