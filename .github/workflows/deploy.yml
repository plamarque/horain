# Deploy Horain to production on push to main
# - Frontend → GitHub Pages (this workflow)
# - Backend → Render (auto-deploys when repo is connected; see RENDER_SETUP.md)
#
# CI: Backend unit tests + e2e tests run before deploy. E2E requires OPENAI_API_KEY secret.
name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Run backend unit tests
        working-directory: backend
        run: mvn test -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install root dependencies (promptfoo for evals)
        run: npm ci
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run e2e tests
        working-directory: frontend
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HORAIN_API_KEY: ${{ secrets.HORAIN_API_KEY || 'HORAIN_DEV_KEY' }}
          PROMPTFOO_DISABLE_WAL_MODE: 'true'
        run: |
          cd ..
          cd backend
          mvn spring-boot:run -Dspring-boot.run.jvmArguments="-Dserver.address=0.0.0.0" &
          BACKEND_PID=$!
          echo "Waiting for backend to be ready..."
          for i in $(seq 1 60); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/health 2>/dev/null | grep -q 200; then
              echo "Backend ready."
              break
            fi
            sleep 2
          done
          curl -s http://localhost:8080/health || true

          echo "Seeding backend for evals and e2e..."
          curl -s -X POST http://localhost:8080/dev/seed \
            -H "Authorization: Bearer ${HORAIN_API_KEY:-HORAIN_DEV_KEY}" \
            -H "Content-Type: application/json" -d '{"fixedToday":"2025-03-10"}' || true

          echo "Running Promptfoo evals (deterministic only)..."
          cd ..
          npm run eval:deterministic -- --no-cache
          cd frontend

          echo "Running e2e tests..."
          npm run test:e2e

  build-and-deploy-frontend:
    name: Build and deploy frontend
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_KEY: ${{ secrets.VITE_API_KEY }}
          VITE_STT_LANG: ${{ secrets.VITE_STT_LANG }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy-frontend:
    name: Deploy to GitHub Pages
    needs: build-and-deploy-frontend
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
