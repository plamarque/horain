# Cloud Build config for Horain backend → Cloud Run
# Trigger on push to main; set substitutions in the trigger:
#   _REGION (e.g. europe-west1), _SERVICE_NAME (e.g. horain-api), _REPOSITORY (e.g. horain)
# See docs/CLOUD_RUN_SETUP.md

steps:
  # Build image from backend/ (Dockerfile context = backend)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/horain-backend:${COMMIT_SHA}'
      - '-f'
      - 'Dockerfile'
      - '.'
    dir: 'backend'

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/horain-backend:${COMMIT_SHA}'

  # Deploy to Cloud Run (env vars and secrets are configured on the service)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/horain-backend:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--port'
      - '8080'
      - '--cpu-boost'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/horain-backend:${COMMIT_SHA}'
