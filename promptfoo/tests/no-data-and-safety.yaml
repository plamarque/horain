# Safety - agent handles unknown project (create or clarify)

- description: Unknown project - agent creates or acknowledges
  vars:
    message: "90 minutes on NonExistentProjectXYZ"
  assert:
    - type: icontains-any
      value:
        - "create"
        - "unknown"
        - "not found"
        - "couldn't find"
        - "logged"
        - "NonExistentProjectXYZ"
