# Unknown project - agent should offer to create

- description: Unknown project - agent offers to create
  vars:
    message: "40 minutes on ZzzUnknownEvalProject123"
  assert:
    - type: icontains-any
      value:
        - "create"
        - "don't know"
        - "unknown"
        - "not found"
        - "no project"
        - "doesn't exist"
        - "couldn't find"
        - "matching"
