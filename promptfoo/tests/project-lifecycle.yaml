# Project lifecycle - unknown, ambiguous, rename, delete project

- description: Unknown project - proposition seule
  vars:
    message: "40 minutes on ZzzPropositionOnly999"
  assert:
    - type: icontains-any
      value:
        - "create"
        - "don't know"
        - "unknown"
        - "not found"
        - "couldn't find"
        - "should I"
    - type: javascript
      value: |
        let o; let tc = [];
        try { o = typeof output === 'string' ? JSON.parse(output) : output; tc = (o && o.toolCalls) || []; } catch (_) {}
        const hasCreateLog = tc.some(t => t.name === 'create_time_log');
        const hasCreateProject = tc.some(t => t.name === 'create_project');
        if (!hasCreateLog && !hasCreateProject) return true;
        const msg = (o && o.message || '').toLowerCase();
        if (hasCreateProject && (msg.includes('logged') || msg.includes('créé') || msg.includes('created') || msg.includes('recorded'))) return true;
        return false;

# Use a project name that no other test creates, so this test is stable when evals run in parallel.
- description: Unknown project - turn 1 proposal
  vars:
    message: "40 minutes on ZzzUnknownTurn1Proposal999"
  assert:
    - type: icontains-any
      value:
        - "create"
        - "should I"
        - "don't know"

# Self-contained: fixed assistant proposal so order/parallelism does not affect this test.
- description: Unknown project + confirmation
  vars:
    message: "yes, create it"
    history:
      - role: user
        content: "40 minutes on {{evalProposalProject}}"
      - role: assistant
        content: "I don't know a project named {{evalProposalProject}} yet. Should I create it and log 40 minutes?"
  metadata:
    conversationId: unknownLifecycle
  assert:
    - type: javascript
      value: |
        let o; let tc = [];
        try { o = typeof output === 'string' ? JSON.parse(output) : output; tc = (o && o.toolCalls) || []; } catch (_) {}
        const hasCreateProject = tc.some(t => t.name === 'create_project');
        const hasCreateTimeLog = tc.some(t => t.name === 'create_time_log');
        const msg = ((o && o.message) || '').toLowerCase();
        const confirmsInMessage = msg.includes('logged') || msg.includes('créé') || msg.includes('created') || msg.includes('recorded');
        return (hasCreateProject && hasCreateTimeLog) || confirmsInMessage;

- description: Unknown project + refus - turn 1
  vars:
    message: "40 minutes on RefuseProject123"
  options:
    storeOutputAs: unknownRefuseProposal
    transform: "(typeof output === 'string' ? JSON.parse(output) : output).message || output"
  metadata:
    conversationId: unknownRefuse
  assert:
    - type: icontains-any
      value:
        - "create"
        - "should I"

- description: Unknown project + refus
  vars:
    message: "no"
    history:
      - role: user
        content: "40 minutes on RefuseProject123"
      - role: assistant
        content: "{{unknownRefuseProposal}}"
  metadata:
    conversationId: unknownRefuse
  assert:
    - type: javascript
      value: |
        let o; let tc = [];
        try { o = typeof output === 'string' ? JSON.parse(output) : output; tc = (o && o.toolCalls) || []; } catch (_) {}
        return !tc.some(t => t.name === 'create_project') && !tc.some(t => t.name === 'create_time_log');

# Typo / close match: propose existing project (e.g. Horain) instead of creating (e.g. Horian)
- description: Typo - close match proposal (Horian -> Horain)
  vars:
    message: "j'ai travaillé 2H sur Horian"
  metadata:
    conversationId: typoCloseMatch
  assert:
    - type: javascript
      value: |
        const raw = output != null ? (typeof output === 'string' ? output : (output.message != null ? output.message : JSON.stringify(output))) : '';
        const msg = raw.toLowerCase();
        const hasHorain = raw.includes('Horain');
        const suggestsCorrection = /vouliez|voulais|dire|dois-je|devrais-je|enregistrer|mean|meant|log/.test(msg);
        let noCreateProject = true;
        try {
          const o = typeof output === 'string' ? JSON.parse(output) : output;
          const tc = (o && Array.isArray(o.toolCalls)) ? o.toolCalls : [];
          noCreateProject = !tc.some(t => t && t.name === 'create_project');
        } catch (_) {}
        return hasHorain && suggestsCorrection && noCreateProject;

# Self-contained: fixed assistant message so this test works even if "Typo - close match proposal" failed (e.g. Unauthorized)
- description: Typo - after user confirms close match
  vars:
    message: "oui"
    history:
      - role: user
        content: "j'ai travaillé 2H sur Horian"
      - role: assistant
        content: "I don't have a project named Horian. Did you mean Horain? Should I log 120 minutes on Horain?"
  metadata:
    conversationId: typoCloseMatch
  assert:
    - type: javascript
      value: |
        let o; let tc = [];
        try { o = typeof output === 'string' ? JSON.parse(output) : output; tc = (o && o.toolCalls) || []; } catch (_) {}
        const hasCreateTimeLog = tc.some(t => t.name === 'create_time_log');
        const noCreateProject = !tc.some(t => t.name === 'create_project');
        return hasCreateTimeLog && noCreateProject;

- description: Ambiguous - question
  vars:
    message: "25 minutes on HatCast"
  assert:
    - type: icontains-all
      value:
        - "HatCast"
        - "25"
    - type: icontains-any
      value:
        - "which"
        - "V1"
        - "V2"
        - "quel"
    - type: javascript
      value: |
        let o; let tc = [];
        try { o = typeof output === 'string' ? JSON.parse(output) : output; tc = (o && o.toolCalls) || []; } catch (_) {}
        const hasCreate = tc.some(t => t.name === 'create_time_log');
        if (!hasCreate) return true;
        const msg = ((o && o.message) || '').toLowerCase();
        return msg.includes('hatcast') && (msg.includes('v1') || msg.includes('v2')) && (msg.includes('25') || msg.includes('logged'));

