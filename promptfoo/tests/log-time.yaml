# Log time evals - direct log, project from seed

- description: Log time direct - 30 minutes on Chrono EPS
  vars:
    message: "30 minutes on Chrono EPS"
  assert:
    - type: icontains-all
      value:
        - "Chrono"
        - "30"
        - "logged"

- description: Log time with note - Horain
  vars:
    message: "45 minutes on Horain working on the sync engine"
  assert:
    - type: icontains-all
      value:
        - "Horain"
        - "45"
        - "logged"

- description: Log time - 20 minutes on Festibask
  vars:
    message: "20 minutes on Festibask"
  assert:
    - type: icontains-all
      value:
        - "Festibask"
        - "20"
        - "logged"
