# Log time evals - direct log, project from seed (Horain, Chrono EPS, etc.)

- description: Log time direct - 30 minutes on Chrono EPS
  vars:
    message: "30 minutes on Chrono EPS"
  assert:
    - type: icontains-any
      value:
        - "Chrono"
        - "30"
        - "logged"
        - "created"
        - "minutes"

- description: Log time with note - Horain
  vars:
    message: "45 minutes on Horain working on the sync engine"
  assert:
    - type: icontains-any
      value:
        - "Horain"
        - "45"
        - "logged"
        - "created"
        - "minutes"
