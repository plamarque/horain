# Robustness - paraphrases, fr/en mix

- description: Robustness - "demi-heure" normalized to 30 min
  vars:
    message: "J'ai passé une demi-heure sur Chrono EPS ce matin"
  assert:
    - type: icontains-all
      value:
        - "Chrono"
        - "30"
    - type: icontains-any
      value:
        - "logged"
        - "créé"
        - "enregistré"
        - "recorded"

- description: Robustness - mixed French/English
  vars:
    message: "45 min on Horain for the sync engine"
  assert:
    - type: icontains-all
      value:
        - "Horain"
        - "45"
    - type: icontains-any
      value:
        - "logged"
        - "created"
        - "recorded"
