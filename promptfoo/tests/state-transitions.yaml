# Multi-turn - log then ask analytics (history via provider when vars.history provided)

- description: State transition - log 30 min on Horain
  vars:
    message: "30 minutes on Horain"
  options:
    storeOutputAs: turn1Message
    transform: "(typeof output === 'string' ? JSON.parse(output) : output).message || output"
  metadata:
    conversationId: conv1
  assert:
    - type: icontains-all
      value:
        - "Horain"
        - "30"
    - type: icontains-any
      value:
        - "logged"
        - "créé"
        - "recorded"

- description: State transition - follow-up analytics uses context
  vars:
    message: "Et combien cette semaine ?"
    history:
      - role: user
        content: "30 minutes on Horain"
      - role: assistant
        content: "{{turn1Message}}"
  metadata:
    conversationId: conv1
  assert:
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const msg = (o.message || '').toLowerCase();
        const hasNumber = /\d+/.test(msg);
        const hasTimeWord = /heure|hour|total|temps|time|minute/.test(msg);
        return hasNumber && hasTimeWord;
