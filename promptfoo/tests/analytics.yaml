# Analytics - totaux déterministes (seed eval)

- description: Analytics - total this week (French)
  vars:
    message: "Combien de temps cette semaine ?"
  assert:
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const tc = o.toolCalls || [];
        return tc.some(t => t.name === 'get_current_datetime');
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const msg = (o.message || '').toLowerCase();
        const totalMatch = msg.match(/(\d+)[,.]?\d*\s*(?:heures?|hours?|minutes?)/);
        return totalMatch && parseInt(totalMatch[1], 10) > 0;

