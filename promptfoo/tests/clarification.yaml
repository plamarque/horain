# Clarification - missing duration, unknown project, ambiguous project (SPEC)

- description: Missing duration - agent asks for estimate
  vars:
    message: "I worked on Horain all morning"
  assert:
    - type: icontains-any
      value:
        - "duration"
        - "estimate"
        - "how long"
        - "minutes"
        - "hours"

- description: Unknown project - agent proposes creation (no direct log)
  vars:
    message: "40 minutes on ZzzUnknownEvalProject123"
  assert:
    - type: icontains-any
      value:
        - "create"
        - "don't know"
        - "unknown"
        - "not found"
        - "couldn't find"
        - "should I"
    - type: javascript
      value: |
        try {
          let raw = typeof output === 'string' ? output : (output?.output ?? JSON.stringify(output));
          if (typeof raw === 'object') raw = JSON.stringify(raw);
          const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
          const tc = Array.isArray(o?.toolCalls) ? o.toolCalls : (Array.isArray(o?.tool_calls) ? o.tool_calls : []);
          const hasCreateLog = tc.some(t => (t?.name || t?.function?.name || '').toString() === 'create_time_log');
          const hasCreateProject = tc.some(t => (t?.name || t?.function?.name || '').toString() === 'create_project');
          if (!hasCreateLog) return true;
          const msg = (o?.message || raw || '').toLowerCase();
          if (hasCreateProject && (msg.includes('logged') || msg.includes('créé') || msg.includes('created') || msg.includes('recorded'))) return true;
          return msg.includes('should i') && msg.includes('create') && !msg.includes('logged');
        } catch (e) { return false; }

- description: Ambiguous project - agent asks which one (no direct log)
  vars:
    message: "25 minutes on HatCast"
  assert:
    - type: icontains-all
      value:
        - "HatCast"
        - "25"
    - type: icontains-any
      value:
        - "which"
        - "V1"
        - "V2"
        - "quel"
    - type: javascript
      value: |
        try {
          let raw = typeof output === 'string' ? output : (output?.output ?? JSON.stringify(output));
          if (typeof raw === 'object') raw = JSON.stringify(raw);
          const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
          const tc = Array.isArray(o?.toolCalls) ? o.toolCalls : (Array.isArray(o?.tool_calls) ? o.tool_calls : []);
          const hasCreate = tc.some(t => (t?.name || t?.function?.name || '').toString() === 'create_time_log');
          if (!hasCreate) return true;
          const msg = (o?.message || raw || '').toLowerCase();
          return msg.includes('hatcast') && (msg.includes('v1') || msg.includes('v2')) && (msg.includes('25') || msg.includes('logged'));
        } catch (e) { return false; }
