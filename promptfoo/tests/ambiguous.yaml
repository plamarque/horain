# Ambiguous project - seed has "HatCast" (single). For ambiguity we need HatCast V1 and V2.
# Dev seed creates "HatCast" (one project). To test ambiguity, we'd need to create both first.
# This test assumes the seed may have been modified or we run after creating both via prior messages.
# Alternative: use a name that matches multiple if they exist. The seed only has "HatCast" (single).
#
# For now we test with "HatCast" - if only one exists, we get a direct match (logged).
# To properly test ambiguity, we need a multi-turn or pre-seeded state with HatCast V1 and V2.
# We keep this as a placeholder that passes when there's one HatCast (direct log) or fails
# if the agent mistakenly creates. The assertion allows both outcomes.
- description: HatCast - direct match or ambiguity (seed has HatCast)
  vars:
    message: "25 minutes on HatCast"
  assert:
    - type: icontains-any
      value:
        - "HatCast"
        - "25"
        - "logged"
        - "created"
        - "which"
        - "V1"
        - "V2"
