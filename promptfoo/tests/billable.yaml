# Billable - happy path, edge case, report/clarification

- description: Billable - create project and log time (entry inherits billable)
  vars:
    message: "Create a project named BillableEvalTest as billable, then log 25 minutes on it"
  assert:
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const tc = o.toolCalls || [];
        const hasCreateProject = tc.some(t => t.name === 'create_project');
        const hasCreateTimeLog = tc.some(t => t.name === 'create_time_log');
        return hasCreateProject && hasCreateTimeLog;
    - type: icontains-any
      value:
        - "BillableEvalTest"
        - "25"
        - "logged"
        - "créé"
        - "enregistré"

- description: Billable - update entry to non-billable
  vars:
    message: "mark that entry as non-billable"
    contextEntries:
      - id: "00000000-0000-0000-0000-000000000002"
        projectId: "11111111-1111-1111-1111-111111111101"
        projectName: "Horain"
        durationMinutes: 20
        note: "billable override test"
        billable: true
        loggedAt: "2025-03-10T12:00:00Z"
  assert:
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const tc = o.toolCalls || [];
        const updateCall = tc.find(t => t.name === 'update_time_log');
        if (!updateCall) return false;
        const args = typeof updateCall.arguments === 'string'
          ? JSON.parse(updateCall.arguments || '{}') : (updateCall.arguments || {});
        return args.billable === false;

- description: Billable - report question uses billable sum or chart
  vars:
    message: "Combien de temps facturé cette semaine ?"
  assert:
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const tc = o.toolCalls || [];
        const hasBillableSum = tc.some(t => t.name === 'sum_billable_time_for_period');
        const hasChart = tc.some(t => t.name === 'get_time_aggregated_for_chart'
          && (t.arguments || '').includes('billable_vs_non_billable'));
        const hasDatetime = tc.some(t => t.name === 'get_current_datetime');
        return (hasBillableSum || hasChart) && hasDatetime;

# Regression: "toutes les activités" without date must use all-time range, not an arbitrary month (e.g. October)
- description: Billable mass toggle - all activities for project without date uses all-time range and asks confirmation
  vars:
    message: "bascule toutes les activités associées à Horain en facturable"
  assert:
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const tc = o.toolCalls || [];
        const periodCall = tc.find(t => t.name === 'get_time_logs_for_period');
        if (!periodCall) return false;
        const args = typeof periodCall.arguments === 'string'
          ? JSON.parse(periodCall.arguments || '{}') : (periodCall.arguments || {});
        const start = (args.start || '').toString();
        // Must use all-time start (2000-01-01), not an arbitrary month like October (e.g. 2025-10, 2024-10)
        const usesAllTime = start.startsWith('2000-01-01');
        const usesOctober = /-10-|-10T/.test(start);
        return usesAllTime && !usesOctober;
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const text = (o.message || o.output || o.text || '').toLowerCase();
        // Must not mention October when user did not specify any month
        return !text.includes('octobre');

# Regression: when user asks to set ALL to billable, confirmation must describe the action (set all N to billable), not current state (X to billable and Y to non-billable)
- description: Billable mass toggle - confirmation must say set all to billable, not "X to billable and Y to non-billable"
  vars:
    message: "bascule toutes les activités associées à Horain en facturable"
  assert:
    - type: javascript
      value: |
        const o = typeof output === 'string' ? JSON.parse(output) : output;
        const tc = o.toolCalls || [];
        const hasPeriod = tc.some(t => t.name === 'get_time_logs_for_period');
        if (!hasPeriod) return false;
        const text = (o.message || o.output || o.text || '').toLowerCase();
        // Must NOT describe current state as the action (bug: "set 4 to billable and 4 to non-billable")
        const wrongPattern = /set \d+ (entries? )?to billable and \d+ (entries? )?to non-billable/;
        if (wrongPattern.test(text)) return false;
        // Should indicate setting entries TO billable (action requested)
        return text.includes('billable') && (text.includes('set') || text.includes('confirm') || text.includes('entries'));
