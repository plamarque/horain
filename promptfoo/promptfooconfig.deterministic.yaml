# Promptfoo configuration - deterministic tests only (no LLM-as-judge).
# Use for CI on PR/push. Run: npx promptfoo eval -c promptfooconfig.deterministic.yaml

description: Horain chat API evals (deterministic only)

defaultTest:
  vars:
    evalProposalProject: "EvalProposal_default"

prompts:
  - "{{message}}"

providers:
  - id: file://providers/horain-api.mjs
    label: Horain API

tests:
  - description: Smoke - backend responds
    vars:
      message: "Hello"
    assert:
      - type: javascript
        value: "output && output.length > 0"
  - description: Log time direct - 20 minutes on Horain
    vars:
      message: "20 minutes on Horain"
    assert:
      - type: icontains-all
        value:
          - "Horain"
          - "20"
      - type: icontains-any
        value:
          - "logged"
          - "créé"
          - "ajouté"
          - "enregistré"
          - "created"
          - "recorded"
  - file://tests/log-time.yaml
  - file://tests/clarification.yaml
  - file://tests/analytics.yaml
  - file://tests/analytics-taux.yaml
  - file://tests/json-ui.yaml
  - file://tests/state-transitions.yaml
  - file://tests/robustness.yaml
  - file://tests/project-lifecycle.yaml
  - file://tests/entry-mutations.yaml
  - file://tests/billable.yaml
  - file://tests/multi-entry-and-followups.yaml
  - file://tests/empty-and-errors.yaml
  - file://tests/memory.yaml
  - file://tests/activity-types.yaml
