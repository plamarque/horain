server:
  port: ${PORT:8080}

# API key for frontend auth. Reads HORAIN_API_KEY from .env or env; falls back to HORAIN_DEV_KEY.
horain:
  api-key: ${HORAIN_API_KEY:HORAIN_DEV_KEY}
  mass-delete-limit: 5  # Max delete_time_log calls per turn; ask user to confirm before more
  dev:
    seed-enabled: true  # Enable POST /dev/seed for local dev; set false in postgres profile

# LLM integration. Reads LLM_API_KEY or OPENAI_API_KEY from .env; enables assistant when set.
llm:
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
  model: ${LLM_MODEL:gpt-4o-mini}
  # client: openai-compatible (default, RestTemplate) | spring-ai (Spring AI ChatModel - known 404 issues)
  client: ${LLM_CLIENT:openai-compatible}

# Load .env from backend/ directory when running locally (optional; Cloud Run injects env vars at runtime).
spring:
  threads:
    virtual:
      enabled: true  # Java 21: lighter concurrency for LLM/HTTP calls
  config:
    import: optional:file:.env[.properties]
  flyway:
    locations: classpath:db/migration/{vendor}
  datasource:
    url: jdbc:h2:mem:horain;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false  # REST API: load data in services; no view rendering
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
      base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
      chat:
        options:
          model: ${LLM_MODEL:gpt-4o-mini}

---
# PostgreSQL profile for deployment (e.g. Cloud Run + Supabase)
spring:
  config:
    activate:
      on-profile: postgres
  flyway:
    baseline-on-migrate: true  # Baseline existing schema; Supabase may have tables from before Flyway
  datasource:
    url: jdbc:postgresql://localhost:5432/horain
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3  # Stay under Supabase Session Pooler connection limit
  jpa:
    open-in-view: false  # REST API: load data in services; no view rendering
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC
          lob:
            non_contextual_creation: true  # PostgreSQL JDBC does not implement createClob()
        timezone:
          default_storage: NORMALIZE_UTC  # Compatible with PostgreSQL timestamptz for Instant fields
        type:
          preferred_instant_jdbc_type: TIMESTAMP  # Fix schema validation: PostgreSQL JDBC reports timestamptz as TIMESTAMP, not TIMESTAMP_UTC

horain:
  api-key: ${HORAIN_API_KEY:HORAIN_DEV_KEY}
  mass-delete-limit: 5  # Max delete_time_log calls per turn; ask user to confirm before more
  dev:
    seed-enabled: false  # Disable dev seed in production

# LLM integration (optional). OPENAI_API_KEY or LLM_API_KEY enables assistant.
# LLM_BASE_URL, LLM_MODEL override defaults when set.
llm:
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
  model: ${LLM_MODEL:gpt-4o-mini}
  client: ${LLM_CLIENT:openai-compatible}
